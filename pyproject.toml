[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-inductor-full-dtype-guard"
version = "0.2.0"
description = "Guards a real torch.compile(backend='inductor') bug: torch.full(size, fill_value, dtype=X) silently drops the dtype cast when fill_value is a symbolic/traced scalar, causing wrong bool-mask sums and a silently-skipped int8 overflow check"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
torch-inductor-full-dtype-guard = "torch_inductor_full_dtype_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
